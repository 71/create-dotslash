[package]
name = "create-dotslash"
version = "0.1.3"
edition = "2024"
rust-version = "1.93"

[dependencies]
async-compression = { version = "0.4.42", default-features = false, features = ["tokio", "gzip", "bzip2"] }
async-tar = { version = "0.6.1", default-features = false, features = ["runtime-tokio"] }
async_zip = { version = "0.0.18", default-features = false, features = ["deflate"] }
base64 = "0.22.1"
blake3 = "1.8.5"
bytes = "1.12.1"
clap = { version = "4.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
hmac-sha256 = "1.1.14"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1"] }
indicatif = { version = "0.18.6", default-features = false }
ruzstd = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
tokio = { version = "1.52", features = ["rt", "sync"] }
xz = "0.4.6-rc.0"

[dev-dependencies]
clap = { version = "4.6", features = ["wrap_help"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
